
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FolderMind</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #0c1019;
      color: #f3f5fa;
    }

    .app {
      max-width: 850px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      padding: 18px 0;
      border-bottom: 1px solid #303746;
    }

    h1 { margin: 0; font-size: 25px; }

    .subtitle {
      color: #9da7b9;
      margin-top: 6px;
      font-size: 14px;
    }

    .chat {
      flex: 1;
      padding: 30px 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      padding: 16px 20px;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      max-width: 85%;
      overflow-wrap: anywhere;
    }

    .user {
      align-self: flex-end;
      background: #3356af;
    }

    .assistant {
      align-self: flex-start;
      background: #1d2635;
      border: 1px solid #303746;
    }

    form {
      display: flex;
      gap: 12px;
      padding: 20px 0;
      border-top: 1px solid #303746;
    }

    input {
      flex: 1;
      background: #1d2635;
      border: 1px solid #39455c;
      border-radius: 12px;
      color: white;
      padding: 15px;
      font-size: 15px;
      min-width: 0;
    }

    button {
      background: #5479e9;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 22px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: #6c8bf0; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>FolderMind</h1>
      <div class="subtitle">
        Local AI Knowledge Assistant · Demo user: Alex (Production)
      </div>
    </header>

    <div id="chat" class="chat">
      <div class="message assistant">
        Welcome to FolderMind. Ask me about your manufacturing documents.
      </div>
    </div>

    <form id="form">
      <input
        id="question"
        placeholder="Ask a question about your documents..."
        autocomplete="off"
        required
      >
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const button = document.getElementById("send");

    function addMessage(text, role) {
      const message = document.createElement("div");
      message.className = "message " + role;
      message.textContent = text;
      chat.appendChild(message);
      message.scrollIntoView({ behavior: "smooth" });
      return message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      button.disabled = true;
      const loading = addMessage("Thinking...", "assistant");

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        if (!response.ok) {
          throw new Error("Server returned " + response.status);
        }

        const data = await response.json();
        loading.textContent = data.answer;

      } catch (error) {
        loading.textContent = "Error: " + error.message;
      } finally {
        button.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
